[project]
name = "sydney-bus-reliability"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32",
    "aws-lambda-powertools>=3.0",
    "boto3>=1.35",
    "gtfs-realtime-bindings>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "moto[s3,ssm]>=5.0",
    "responses>=0.25",
    "mypy>=1.13",
    "pylint>=3.3",
    "isort>=5.13",
    "types-requests",
    "boto3-stubs[s3]>=1.35",
    "numpydoc>=1.11.0",
    "pyarrow-stubs>=20.0.0.20260819",
    "pyarrow==24.0.0",
    "duckdb>=1.5",
    "types-protobuf",
    # Not imported directly: DuckDB requires it to convert
    # TIMESTAMPTZ columns to tz-aware Python datetimes when a query
    # result is fetched, which the merge-SQL tests do. Binding a
    # tz-aware datetime as a query parameter works without it; only
    # the fetch-back path needs it. The merger itself never fetches
    # DuckDB results into Python, so this is test-only.
    "pytz>=2025.1",
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.14"
strict = true

[[tool.mypy.overrides]]
# Generated protobuf code; gtfs-realtime-bindings ships no stubs and
# types-protobuf does not cover the transit bindings. Scoped to this
# one module so the protobuf runtime itself stays type-checked.
module = ["google.transit.*"]
ignore_missing_imports = true

[tool.pylint.typecheck]
# Protobuf builds message classes dynamically at import, so pylint
# cannot resolve members such as FeedMessage. Scoped to the generated
# bindings module only.
ignored-modules = ["google.transit.gtfs_realtime_pb2"]

[tool.numpydoc_validation]
checks = [
    "all",   # report on all checks, except the below
    "EX01",  # don't require "Examples" section
    "SA01",  # don't require "See Also" section
    "ES01",  # don't require extended summary
]
exclude = [
    "\\.__init__$",
]
