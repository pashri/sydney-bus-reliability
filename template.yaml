AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sydney bus GTFS-Realtime collector

Parameters:
  AlertEmail:
    Description: >-
      Address for collector alarm and budget-overrun notifications
    Type: String
  ApiKeyParameterName:
    Description: Name of the SSM SecureString holding the TfNSW API key
    Type: String
    Default: /sydney-bus-reliability/tfnsw-api-key
  PyarrowLayerArn:
    Description: >-
      AWS-managed SDK-for-pandas layer supplying pyarrow. Pinned by
      version: scripts/check_layer_parity.py asserts the pyarrow inside
      it matches uv.lock, so bumping this must bump that too.
    Type: String
    Default: >-
      arn:aws:lambda:ap-southeast-2:336392948345:layer:AWSSDKPandas-Python314-Arm64:11

Globals:
  Function:
    Runtime: python3.14
    Architectures: [arm64]  # cheaper per GB-s; deps are pure Python

Resources:
  DataBucket:
    Metadata:
      Description: >-
        Raw gzipped GTFS-Realtime snapshots under raw/, and
        per-invocation audit records under curated/collector_run/.
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain  # no historical feed; data is irreplaceable
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'sydney-bus-reliability-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRaw
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 30  # we'll change to 7 after compactor is made

  AlertTopic:
    Metadata:
      Description: Fan-out point for collector alarm notifications.
    Type: AWS::SNS::Topic
    Properties:
      TopicName: sydney-bus-reliability-alerts

  AlertSubscription:
    Metadata:
      Description: Email subscription delivering alerts to AlertEmail.
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail  # requires a manual confirmation click
      TopicArn: !Ref AlertTopic

  CollectorLogGroup:
    Metadata:
      Description: Log group for the collector function, retained 30 days.
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sydney-bus-reliability-collector
      RetentionInDays: 30

  CollectorFunction:
    Type: AWS::Serverless::Function
    DependsOn: CollectorLogGroup
    Properties:
      Description: >-
        One invocation per minute: 6 vehicle-position polls at
        t+0..50s plus 1 trip-updates poll at t+0, each anchored
        to an absolute offset, written to S3 as gzipped protobuf.
      FunctionName: sydney-bus-reliability-collector
      CodeUri: .
      Handler: src.collector.handler.handler
      MemorySize: 256  # three peaks measured 153-160 MB after the fix
      Timeout: 120 # Last poll starts at t+50s; this gives a bit of legroom.
      # No ReservedConcurrentExecutions: account quota of 10 forbids it.
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          VEHICLE_OFFSETS_S: '0,10,20,30,40,50'  # cadence lives here only
          API_KEY_PARAMETER_NAME: !Ref ApiKeyParameterName
          POWERTOOLS_SERVICE_NAME: collector
          POWERTOOLS_LOG_LEVEL: INFO
          # glibc keeps a malloc arena per thread; we churn 7 a minute.
          MALLOC_ARENA_MAX: '2'
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DataBucket
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: !Ref ApiKeyParameterName
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)

  CollectorSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No collector invocations in 15 minutes
      AlarmName: collector-not-running
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref CollectorFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching  # no invocations = no data = broken
      AlarmActions: [!Ref AlertTopic]

  # Catches a collector that runs but fails, which the silent
  # alarm above cannot see.
  CollectorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Collector invocation errors
      AlarmName: collector-erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CollectorFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  MonthlyBudget:
    Metadata:
      Description: >-
        Monthly cost budget with an alert at 80% of the $25 limit.
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: sydney-bus-reliability
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 25
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  ScheduleLoaderLogGroup:
    Metadata:
      Description: Log group for the schedule loader, retained 30 days.
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sydney-bus-reliability-schedule-loader
      RetentionInDays: 30

  ScheduleLoaderFunction:
    Type: AWS::Serverless::Function
    DependsOn: ScheduleLoaderLogGroup
    Properties:
      # Runs at noon Sydney, after TfNSW's observed ~10:31 bundle
      # generation. An 03:00 run would only ever hold the previous
      # morning's bundle, so a same-day trackwork or reroute push
      # would never be held during the day it affects.
      Description: >-
        Daily static GTFS capture. Hashes the zip bytes and writes a
        new valid_from snapshot only when content changed. The bundle
        is forward-looking, so a day missed here is a timetable lost
        permanently.
      FunctionName: sydney-bus-reliability-schedule-loader
      CodeUri: .
      Handler: src.schedule_loader.handler.handler
      MemorySize: 2048  # 502 MiB of members streamed; measure and lower
      Timeout: 300  # 21.5 s download measured on a home connection
      Layers:
        - !Ref PyarrowLayerArn
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          API_KEY_PARAMETER_NAME: !Ref ApiKeyParameterName
          POWERTOOLS_SERVICE_NAME: schedule_loader
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        - Statement:
            # Reads prior schedule_check records, writes dimension
            # snapshots. Never deletes: the bucket holds
            # irreplaceable collected data and is Retain-on-delete.
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub '${DataBucket.Arn}/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DataBucket.Arn
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: !Ref ApiKeyParameterName
      Events:
        DailyAtNoon:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 12 * * ? *)
            ScheduleExpressionTimezone: Australia/Sydney

  ScheduleLoaderSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        No successful schedule loader run in 24 hours. Each missed
        day is a permanently unrecoverable timetable, so this is the
        costliest silent failure in the system. 24h rather than the
        36h originally specified: CloudWatch caps an alarm's total
        evaluation window (Period x EvaluationPeriods) at 86400s.
      AlarmName: schedule-loader-not-running
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScheduleLoaderFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]

  ScheduleLoaderErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Schedule loader invocation errors
      AlarmName: schedule-loader-erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScheduleLoaderFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  BucketName:
    Value: !Ref DataBucket
  CollectorFunctionName:
    Value: !Ref CollectorFunction
