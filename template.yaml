AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sydney bus GTFS-Realtime collector

Parameters:
  AlertEmail:
    Description: >-
      Address for collector alarm and budget-overrun notifications
    Type: String
  ApiKeyParameterName:
    Description: Name of the SSM SecureString holding the TfNSW API key
    Type: String
    Default: /sydney-bus-reliability/tfnsw-api-key
  PyarrowLayerArn:
    Description: >-
      AWS-managed SDK-for-pandas layer supplying pyarrow. Pinned by
      version: scripts/check_layer_parity.py asserts the pyarrow inside
      it matches uv.lock, so bumping this must bump that too.
    Type: String
    Default: >-
      arn:aws:lambda:ap-southeast-2:336392948345:layer:AWSSDKPandas-Python314-Arm64:11

Globals:
  Function:
    Runtime: python3.14
    Architectures: [arm64]  # cheaper per GB-s; deps are pure Python

Resources:
  DataBucket:
    Metadata:
      Description: >-
        Raw gzipped GTFS-Realtime snapshots under raw/, and
        per-invocation audit records under curated/collector_run/.
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain  # no historical feed; data is irreplaceable
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'sydney-bus-reliability-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRaw
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 30  # we'll change to 7 after compactor is made
          # The merger folds these into fact_collector_run daily, and
          # that Parquet is kept. Expiring the JSONL also bounds how
          # many objects a merge has to list, which would otherwise
          # grow by about 1,440 a day for the life of the project.
          - Id: ExpireCollectorRunJsonl
            Status: Enabled
            Prefix: curated/collector_run/
            ExpirationInDays: 30
          - Id: ExpirePartials
            Status: Enabled
            Prefix: curated/_partial/
            # 3 days, not 2: the merger must be re-runnable after a
            # weekend failure, and two days leaves no margin.
            ExpirationInDays: 3

  AlertTopic:
    Metadata:
      Description: Fan-out point for collector alarm notifications.
    Type: AWS::SNS::Topic
    Properties:
      TopicName: sydney-bus-reliability-alerts

  AlertSubscription:
    Metadata:
      Description: Email subscription delivering alerts to AlertEmail.
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail  # requires a manual confirmation click
      TopicArn: !Ref AlertTopic

  CollectorLogGroup:
    Metadata:
      Description: Log group for the collector function, retained 30 days.
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sydney-bus-reliability-collector
      RetentionInDays: 30

  CollectorFunction:
    Type: AWS::Serverless::Function
    DependsOn: CollectorLogGroup
    Properties:
      Description: >-
        One invocation per minute: 6 vehicle-position polls at
        t+0..50s plus 1 trip-updates poll at t+0, each anchored
        to an absolute offset, written to S3 as gzipped protobuf.
      FunctionName: sydney-bus-reliability-collector
      CodeUri: src/
      Handler: collector.handler.handler
      MemorySize: 256  # three peaks measured 153-160 MB after the fix
      Timeout: 120 # Last poll starts at t+50s; this gives a bit of legroom.
      # No ReservedConcurrentExecutions: account quota of 10 forbids it.
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          VEHICLE_OFFSETS_S: '0,10,20,30,40,50'  # cadence lives here only
          API_KEY_PARAMETER_NAME: !Ref ApiKeyParameterName
          POWERTOOLS_SERVICE_NAME: collector
          POWERTOOLS_LOG_LEVEL: INFO
          # glibc keeps a malloc arena per thread; we churn 7 a minute.
          MALLOC_ARENA_MAX: '2'
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DataBucket
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: !Ref ApiKeyParameterName
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)

  CollectorSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No collector invocations in 15 minutes
      AlarmName: collector-not-running
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref CollectorFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching  # no invocations = no data = broken
      AlarmActions: [!Ref AlertTopic]

  # Catches a collector that runs but fails, which the silent
  # alarm above cannot see.
  CollectorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Collector invocation errors
      AlarmName: collector-erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CollectorFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  MonthlyBudget:
    Metadata:
      Description: >-
        Monthly cost budget with an alert at 80% of the $25 limit.
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: sydney-bus-reliability
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 25
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  ScheduleLoaderLogGroup:
    Metadata:
      Description: Log group for the schedule loader, retained 30 days.
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sydney-bus-reliability-schedule-loader
      RetentionInDays: 30

  ScheduleLoaderFunction:
    Type: AWS::Serverless::Function
    DependsOn: ScheduleLoaderLogGroup
    Properties:
      # Runs at noon Sydney, after TfNSW's observed ~10:31 bundle
      # generation. An 03:00 run would only ever hold the previous
      # morning's bundle, so a same-day trackwork or reroute push
      # would never be held during the day it affects.
      Description: >-
        Daily static GTFS capture. Hashes the zip bytes and writes a
        new valid_from snapshot only when content changed. The bundle
        is forward-looking, so a day missed here is a timetable lost
        permanently.
      FunctionName: sydney-bus-reliability-schedule-loader
      CodeUri: src/
      Handler: schedule_loader.handler.handler
      MemorySize: 2048  # 502 MiB of members streamed; measure and lower
      Timeout: 300  # 21.5 s download measured on a home connection
      Layers:
        - !Ref PyarrowLayerArn
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          API_KEY_PARAMETER_NAME: !Ref ApiKeyParameterName
          POWERTOOLS_SERVICE_NAME: schedule_loader
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        - Statement:
            # Reads prior schedule_check records, writes dimension
            # snapshots. Never deletes: the bucket holds
            # irreplaceable collected data and is Retain-on-delete.
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub '${DataBucket.Arn}/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DataBucket.Arn
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: !Ref ApiKeyParameterName
      Events:
        DailyAtNoon:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 12 * * ? *)
            ScheduleExpressionTimezone: Australia/Sydney

  ScheduleLoaderSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        No schedule loader invocation in 24 hours. Any invocation
        clears it, failed ones included; ScheduleLoaderErrorAlarm is
        what catches a run that happens and fails. Each missed day
        is a permanently unrecoverable timetable, so this is the
        costliest silent failure in the system. 24h rather than the
        36h originally specified: CloudWatch caps an alarm's total
        evaluation window (Period x EvaluationPeriods) at 86400s.
      AlarmName: schedule-loader-not-running
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScheduleLoaderFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]

  ScheduleLoaderErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Schedule loader invocation errors
      AlarmName: schedule-loader-erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScheduleLoaderFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  CompactorLogGroup:
    Metadata:
      Description: Log group for the compactor function, retained 30 days.
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sydney-bus-reliability-compactor
      RetentionInDays: 30

  CompactorFunction:
    Type: AWS::Serverless::Function
    DependsOn: CompactorLogGroup
    Properties:
      Description: >-
        Compacts the UTC hour that just closed. Fires at H+1:10, not
        H+1:00, because raw keys carry actual fetch time and a late
        retry can write after the hour boundary.
      FunctionName: sydney-bus-reliability-compactor
      CodeUri: src/
      Handler: compactor.handler.handler
      # Measured 1,527 MB peak on an M4 Pro for the worst hour, before
      # the RecordBatch streaming in positions.py. Lower once a real
      # Graviton2 peak is observed in curation_run.peak_rss_mb.
      MemorySize: 2048
      Timeout: 600  # 18.2 s measured on an M4 Pro; Graviton2 is slower
      # No ReservedConcurrentExecutions: account quota of 10 forbids it.
      Layers:
        - !Ref PyarrowLayerArn
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          POWERTOOLS_SERVICE_NAME: compactor
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        - Statement:
            # Reads raw/ objects, writes curated/_partial/ and
            # curated/curation_run/. Never deletes: the bucket holds
            # irreplaceable collected data and is Retain-on-delete.
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub '${DataBucket.Arn}/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DataBucket.Arn
      Events:
        # A plain rate/cron Schedule, not ScheduleV2: this job is
        # indifferent to local time, unlike the noon-Sydney schedule
        # loader, which needs ScheduleV2 for DST safety.
        HourlyLagged:
          Type: Schedule
          Properties:
            Schedule: cron(10 * * * ? *)

  CompactorSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No compactor invocations in 3 hours
      AlarmName: compactor-not-running
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref CompactorFunction
      Statistic: Sum
      Period: 10800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]

  # Catches a compactor that runs but fails, which the silent alarm
  # above cannot see.
  CompactorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Compactor invocation errors
      AlarmName: compactor-erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CompactorFunction
      Statistic: Sum
      Period: 10800
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  DuckdbLayer:
    Metadata:
      Description: >-
        DuckDB for the merger and the checker, with the httpfs and
        aws extensions baked in so no run depends on DuckDB's
        extension repository. Kept
        out of the shared requirements because a runtime dependency
        is bundled into every function's package, which took the
        schedule loader to 416 MB against a 250 MB limit.
      # Built by layers/duckdb/Makefile, which sam build runs itself.
      # BuildArchitecture is set because it defaults to x86_64, which
      # would ship an x86 binary to an arm64 function.
      BuildMethod: makefile
      BuildArchitecture: arm64
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: sydney-bus-reliability-duckdb
      ContentUri: layers/duckdb
      CompatibleRuntimes: [python3.14]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete

  MergerLogGroup:
    Metadata:
      Description: Log group for the merger function, retained 30 days.
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sydney-bus-reliability-merger
      RetentionInDays: 30

  MergerFunction:
    Type: AWS::Serverless::Function
    DependsOn: MergerLogGroup
    Properties:
      Description: >-
        Assembles one Sydney service day from hourly partials at
        08:00 local. Not midnight: GTFS trips run past midnight to a
        measured hour of 30, and finalising at midnight would truncate
        the night's last services.
      FunctionName: sydney-bus-reliability-merger
      CodeUri: src/
      Handler: merger.handler.handler
      MemorySize: 3008  # the account's ceiling; 4096 is rejected
      Timeout: 600
      # DuckDB sorts a whole service day and spills what will not fit
      # in memory to /tmp. Lambda gives 512 MB there by default, which
      # a full day of partials exhausts before the merge finishes.
      EphemeralStorage:
        Size: 8192
      # No ReservedConcurrentExecutions: account quota of 10 forbids it.
      Layers:
        - !Ref DuckdbLayer
      # The duckdb layer only. Lambda's 250 MB unzipped limit counts
      # a function's package plus every layer attached to it, so this
      # function cannot also take the pyarrow layer the compactor and
      # schedule loader use: 192.1 MB of that plus about 72 MB of
      # duckdb carrying httpfs is over the ceiling. DuckDB reads and
      # writes Parquet natively, so the merger does not need pyarrow.
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          POWERTOOLS_SERVICE_NAME: merger
          POWERTOOLS_LOG_LEVEL: INFO
          # The layer bakes in httpfs, so nothing is downloaded at
          # runtime. HOME stays writable for the fallback path, which
          # fetches it if the baked copy is ever missing.
          HOME: /tmp
      Policies:
        - Statement:
            # Reads curated/collector_run/ and curated/_partial/,
            # writes curated/fact_*/. Never deletes: the bucket holds
            # irreplaceable collected data and is Retain-on-delete.
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub '${DataBucket.Arn}/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt DataBucket.Arn
      Events:
        DailyAfterLastTrips:
          Type: ScheduleV2
          Properties:
            # 08:00, not 04:00. The merge window runs to 07:00 local,
            # because a trip can belong to this service day and still
            # be running at GTFS hour 30. A 04:00 run cannot see the
            # last hours of the day it is assembling, and reported a
            # short day every night without anything being wrong.
            ScheduleExpression: cron(0 8 * * ? *)
            ScheduleExpressionTimezone: Australia/Sydney

  MergerSilentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        No merger invocation in 24 hours. Any invocation clears it,
        failed ones included; MergerErrorAlarm is what catches a run
        that happens and fails. CloudWatch caps an alarm's total
        evaluation window at 86400s, so the 36h of
        nightly-plus-slack originally specified is not expressible.
      AlarmName: merger-not-running
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref MergerFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]

  # Catches a merger that runs but fails, which the silent alarm above
  # cannot see - counting Invocations, not Errors, is why three
  # consecutive failed runs never tripped it.
  MergerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Merger invocation errors
      AlarmName: merger-erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref MergerFunction
      Statistic: Sum
      # An hour, matching the schedule loader, which is also a
      # once-a-day job. A day-long window kept the alarm red for
      # twenty-four hours after a single error, including a failed
      # manual re-run, and hid any new error while it was red.
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  MergerAnomalyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: >-
        A merged day failed a data check. The merger's log names the
        check and its value. Re-merge within three days, while the
        partials last; after that only a replay from raw repairs it.
      AlarmName: merger-anomalies
      # Emitted by the merger as an embedded metric in its log, once per
      # checked day, zero included; no IAM permission is involved.
      Namespace: SydneyBusReliability
      MetricName: Anomalies
      Dimensions:
        - Name: service
          Value: merger
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # A day with no merge is merger-not-running's to report.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  CheckerLogGroup:
    Metadata:
      Description: Log group for the checker function, retained 30 days.
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sydney-bus-reliability-checker
      RetentionInDays: 30

  CheckerFunction:
    Type: AWS::Serverless::Function
    DependsOn: CheckerLogGroup
    Properties:
      Description: >-
        Read-only health check over the curated layer, invoked on
        demand. Reports the collector's polling and the curation
        functions' runs for a window of Sydney days, and forms no
        opinion about whether a figure is good.
      FunctionName: sydney-bus-reliability-checker
      CodeUri: src/
      Handler: checker.handler.handler
      MemorySize: 1024
      Timeout: 120
      # No ReservedConcurrentExecutions: account quota of 10 forbids it.
      Layers:
        - !Ref DuckdbLayer
      # DuckDB only. The check reads Parquet and JSON through DuckDB
      # and never builds an Arrow table, so it needs no pyarrow.
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          POWERTOOLS_SERVICE_NAME: checker
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
      # No Events and no silent alarm: this runs when asked, so no
      # invocations for a day is its normal state, not a fault.

Outputs:
  BucketName:
    Value: !Ref DataBucket
  CollectorFunctionName:
    Value: !Ref CollectorFunction
  CheckerFunctionName:
    Value: !Ref CheckerFunction
