name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run pytest tests/
      - run: uv run mypy src/ scripts/
      - run: uv run isort --check-only src/ tests/ scripts/
      - run: uv run pylint src/ scripts/
      - run: uv run python -m scripts.check_layer_parity
      # Guard the glob: numpydoc exits 0 given no files, which would
      # silently retire the check.
      - run: |
          test "$(find src scripts -name '*.py' | wc -l)" -gt 0 \
            || { echo 'no python files found'; exit 1; }
          find src scripts -name '*.py' -print0 \
            | xargs -0 uv run numpydoc lint

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - run: sam validate --lint --region ap-southeast-2
