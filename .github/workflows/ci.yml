name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      - run: uv run pytest tests/
      - run: uv run mypy src/
      - run: uv run isort --check-only src/ tests/
      - run: uv run pylint src/
      - run: uv run numpydoc lint $(find src -name "*.py")

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam validate --lint --region ap-southeast-2
