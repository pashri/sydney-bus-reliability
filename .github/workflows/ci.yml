name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - run: uv sync --frozen
      # Both delegate to the Makefile so CI and a local run cannot
      # disagree about what the checks are. Kept as two steps rather
      # than `make check`, so a failure names itself, and because the
      # sam validate inside `check` belongs to the other job.
      - run: make test
      - run: make lint

  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - run: sam validate --lint --region ap-southeast-2
